# Weekly grouped dependency PRs (security advisories open same-day). Docker is added when the
# deferred distributed images land. See SECURITY.md for the vuln-reporting policy.
#
# DataFusion-family rule: never merge a Dependabot cargo group that bundles a safe bump with a
# DataFusion/Arrow MAJOR bump — the whole `datafusion` + `datafusion-spark` + `iceberg*` family
# is pinned to one DataFusion version and must be bumped together, deliberately. Split the group
# and land targeted bumps instead.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # The `uv` package-ecosystem entry returns in phase 3, when the uv workspace members and the
  # checked-in uv.lock land — until then Dependabot would error weekly on a repo with no uv
  # dependency file.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
