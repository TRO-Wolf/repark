# TOML format + lint check (config in .taplo.toml). Runs the same uvx-pinned taplo as
# `make toml-check` — bump the version here and in the Makefile pin in the same change.
name: taplo

on:
  push:
    branches: [main]  # PR coverage comes from `pull_request`; this avoids the double run
    paths: ["**/*.toml", ".taplo.toml", ".github/workflows/taplo.yml"]
  pull_request:
    # No `paths:` filter — required status check; a path-filtered required check never runs on
    # non-matching PRs, leaving them permanently BLOCKED (task/lessons.md 2026-08-07). The
    # `push` trigger above stays filtered: main-branch runs are record-keeping, not merge gates.

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch or scheduled run, so
  # main keeps an unbroken record. Without this, three quick pushes stacked three full runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.9.5"  # Makefile UV_VERSION
      - name: taplo format --check
        run: uvx taplo@0.9.3 format --check
      - name: taplo lint
        run: uvx taplo@0.9.3 lint
