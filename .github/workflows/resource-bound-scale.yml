name: resource-bound-scale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-bound-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    name: ICE-RESOURCE-BOUND-1 4x and 16x cells
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: sync record extras and build the native module
        run: |
          uv sync --locked --extra record --no-install-package repark
          (cd python/repark && uvx maturin@1.14.1 develop --profile ci)
      - name: the 4x and 16x resource-bound cells
        env:
          REPARK_RESOURCE_BOUND_SCALE: "1"
        run: >-
          uv run --locked --no-sync pytest
          python/repark/tests/writes/test_ice_resource_bound_1.py -q -k scale
