name: resource-bound-scale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-bound-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    name: ICE-RESOURCE-BOUND-1 4x and 16x cells
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: sync record extras and build the native module
        run: |
          uv sync --locked --extra record --no-install-package repark
          (cd python/repark && uvx maturin@1.14.1 develop --profile ci)
      - name: the 4x and 16x resource-bound cells
        env:
          REPARK_RESOURCE_BOUND_SCALE: "1"
        run: >-
          uv run --locked --no-sync pytest
          python/repark/tests/writes/test_ice_resource_bound_1.py -q -k scale
