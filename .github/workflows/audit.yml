# Scan Rust dependencies with the same pinned cargo-audit version as the Makefile.
name: cargo-audit

on:
  push:
    branches: [main]  # PR coverage comes from `pull_request`; this avoids the double run
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch or scheduled run, so
  # main keeps an unbroken record. Without this, three quick pushes stacked three full runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e  # v2
        with:
          tool: cargo-audit@0.22.1
      - name: cargo audit
        run: cargo audit
