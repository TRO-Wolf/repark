# PR and main builds use a host debug wheel; tags use a cold manylinux release build without cache.
# Keep this required workflow unfiltered and install explicit wheel paths to prevent PyPI shadowing.
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: code changed
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CODE=$(git diff --name-only "$BASE" "$GITHUB_SHA" \
            | grep -vE '\.md$' \
            | grep -vE '^(docs|task)/.*\.(json|html|txt|csv|svg|png)$' \
            || true)
          if [ -n "$CODE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  build:
    name: build debug wheel (profile ci)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 (node24)
        with:
          prefix-key: "v2-df54-wheel"
          shared-key: "wheel"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          maturin-version: "v1.14.1"
          command: build
          args: --out dist --profile ci
          working-directory: python/repark
          container: "off"
      - name: import smoke test
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          WHEEL=$(ls python/repark/dist/repark-*.whl)
          /tmp/wheeltest/bin/pip install "$WHEEL"
          /tmp/wheeltest/bin/python -c "import repark; print('repark', repark.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wheel-ci
          path: python/repark/dist/repark-*.whl
          retention-days: 1
          if-no-files-found: error

  facade:
    name: facade shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: wheel-ci
          path: python/repark/dist
      - name: facade tests against the built wheel
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          WHEEL=$(ls "$PWD"/python/repark/dist/repark-*.whl)
          /tmp/wheeltest/bin/pip install "repark[numpy,pandas,polars,ml-ext] @ file://$WHEEL" pytest pytest-xdist ./python/repark-parity
          FILES=$(ls python/repark/tests/test_*.py | sort | awk -v s="$SHARD" 'NR % 3 == s')
          if [ "$SHARD" = "2" ]; then FILES="$FILES python/repark/tests/test_ci1_forced_failure_missing.py"; fi
          /tmp/wheeltest/bin/python -m pytest $FILES -q -n 4 --durations=25

  dbt:
    name: dbt-adapter tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: wheel-ci
          path: python/repark/dist
      - name: install the built wheel
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          WHEEL=$(ls "$PWD"/python/repark/dist/repark-*.whl)
          /tmp/wheeltest/bin/pip install "repark[numpy,pandas,polars,ml-ext] @ file://$WHEEL" pytest pytest-xdist ./python/repark-parity
      - name: dbt-adapter tests against the built wheel
        run: |
          /tmp/wheeltest/bin/pip install "dbt-core==1.9.11" "dbt-spark==1.9.3"
          /tmp/wheeltest/bin/python -m pytest python/dbt-repark/tests -q

  examples:
    name: example-coverage execute
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: wheel-ci
          path: python/repark/dist
      - name: install the built wheel
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          WHEEL=$(ls "$PWD"/python/repark/dist/repark-*.whl)
          /tmp/wheeltest/bin/pip install "repark[numpy,pandas,polars,ml-ext] @ file://$WHEEL" pytest pytest-xdist ./python/repark-parity
      - name: example-coverage execute (require native)
        run: /tmp/wheeltest/bin/python -I scripts/check_example_coverage.py --require-execute

  smoke:
    name: build + import smoke (debug, host)
    needs: [changes, build, facade, dbt, examples]
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          FACADE: ${{ needs.facade.result }}
          DBT: ${{ needs.dbt.result }}
          EXAMPLES: ${{ needs.examples.result }}
        run: |
          if [ "$CHANGES" = "success" ] && [ "$CODE" = "false" ]; then
            echo "docs-only change, the wheel is unchanged"
            exit 0
          fi
          for result in "$BUILD" "$FACADE" "$DBT" "$EXAMPLES"; do
            if [ "$result" != "success" ]; then
              echo "build=$BUILD facade=$FACADE dbt=$DBT examples=$EXAMPLES"
              exit 1
            fi
          done
          echo "build, facade, dbt and examples all succeeded"

  release-wheels:
    name: manylinux release wheels (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          maturin-version: "v1.14.1"  # Makefile MATURIN pin
          command: build
          args: --release --out dist
          working-directory: python/repark
          manylinux: auto
          # Explicitly off: tag-triggered artifact publish must not restore shared build cache
          # (zizmor cache-poisoning). Cold manylinux builds are rare and acceptable.
          sccache: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wheels-linux
          path: python/repark/dist/*.whl
      - name: import smoke test
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          WHEEL=$(ls python/repark/dist/repark-*.whl)
          /tmp/wheeltest/bin/pip install "$WHEEL"
          /tmp/wheeltest/bin/python -c "import repark; print('repark', repark.__version__)"

  platform-matrix:
    name: abi3 wheel (${{ matrix.leg }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: manylinux-aarch64
            runs-on: ubuntu-24.04-arm
            manylinux: auto
          - leg: macos-arm64
            runs-on: macos-latest
          - leg: macos-x86_64
            runs-on: macos-15-intel
          - leg: windows-x86_64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        if: matrix.manylinux == 'auto'
        with:
          maturin-version: "v1.14.1"
          command: build
          args: --release --out dist
          working-directory: python/repark
          manylinux: auto
          sccache: "false"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        if: matrix.manylinux != 'auto'
        with:
          maturin-version: "v1.14.1"
          command: build
          args: --release --out dist
          working-directory: python/repark
          container: "off"
          sccache: "false"
      - name: import + collect smoke (wheel, explicit path)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/wheeltest
          if [ -x /tmp/wheeltest/bin/python ]; then PY=/tmp/wheeltest/bin/python; else PY=/tmp/wheeltest/Scripts/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install python/repark/dist/repark-*.whl
          "$PY" -c "import repark; from repark.spark import ReparkSession; s = ReparkSession.builder.appName('wheel-matrix-smoke').getOrCreate(); assert [r.id for r in s.range(3).collect()] == [0, 1, 2]; print('wheel OK', repark.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.leg }}
          path: python/repark/dist/*.whl
          if-no-files-found: error
