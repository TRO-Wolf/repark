# This is the only live-AWS workflow. It runs merged code nightly or manually through OIDC on a
# GitHub-hosted runner; it is never a required check and puts no secrets in tier 1.
# `environment: aws-acceptance` supplies human approval and the main-only deployment policy. The
# in-file ref guard and IAM subject do not establish that branch boundary.
# Mint credentials only after checkout, tool setup, dependency sync, and the native build. Mask the
# account ID so tracebacks cannot expose ARNs in the public log.
# Run only the acceptance module. Refuse placeholder buckets before signing requests. A missing
# TABLE_BUCKET_ARN skips the S3 Tables leg.
# docs/tier2-aws.md owns operator inputs and setup. Local checks cannot prove environment approval,
# OIDC exchange, or scheduling; the first manual run is the post-merge acceptance proof.
name: aws-acceptance

on:
  schedule:
    - cron: "43 8 * * *"  # nightly ~08:43 UTC — offset from the parity cron (07:17)
  workflow_dispatch:
    inputs:
      leg:
        description: "acceptance (the nightly module) or ice-read-perf-bench (the read bench, docs/tier2-aws.md §8)"
        type: choice
        options:
          - acceptance
          - ice-read-perf-bench
        default: acceptance
      purpose:
        description: "why this dispatch runs (the unit it measures), echoed into the job summary"
        type: string
        required: false
        default: ""
      baseline:
        description: "run with page selection off and no shared caches — the before half of a pair on one head"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-acceptance-${{ github.workflow }}
  cancel-in-progress: false  # never cancel a live-AWS run mid-commit; runs serialize instead

jobs:
  build:
    name: build the native wheel (no credentials)
    if: github.event_name == 'schedule' || inputs.leg == 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: sync + build the wheel
        run: |
          uv sync --locked --extra record --no-install-package repark
          (cd python/repark && uvx maturin@1.14.1 build --release --out ../../wheel)
          cp uv.lock wheel/uv.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-wheel
          path: wheel/
          if-no-files-found: error
          retention-days: 1

  acceptance-dbt:
    name: tier-2 live AWS acceptance + dbt gold (Glue + S3 Tables, scratch-only)
    needs: build
    if: github.event_name == 'schedule' || inputs.leg == 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    env:
      REPARK_ACCEPT_RUN_ID: ${{ github.run_id }}
      REPARK_ACCEPT_RUN_ATTEMPT: ${{ github.run_attempt }}
      REPARK_ACCEPT_LEG: acc
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acceptance-wheel
          path: wheel
      - name: sync, install the wheel, profiler and boto3
        run: |
          uv sync --locked --extra record --no-install-package repark
          uv pip install --python .venv/bin/python --no-deps wheel/repark-*.whl
          uv pip install --python .venv/bin/python --only-binary :all: py-spy==0.4.1 boto3==1.43.111
          VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet dbt-core==1.9.11 dbt-spark==1.9.3
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-acceptance
          mask-aws-account-id: true
      - name: acceptance module (REPARK_AWS_ACCEPTANCE=1)
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest python/repark/tests/parity/test_aws_acceptance.py -q -rA
      - name: dbt gold acceptance (REPARK_AWS_ACCEPTANCE=1)
        if: ${{ !cancelled() }}
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest python/dbt-repark/tests/test_aws_acceptance_gold.py -q -rA
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-acceptance-cross-read
          mask-aws-account-id: true
      - name: cross-read module (REPARK_AWS_ACCEPTANCE=1)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
          SPARK_LOCAL_IP: "127.0.0.1"
        run: |
          .venv/bin/python -u -m pytest python/repark/tests/parity/test_aws_acceptance_cross_read.py -q -rA --capture=tee-sys &
          pytest_pid=$!
          (
            delay_pid=""
            stop_requested=0
            trap '
              stop_requested=1
              if [ -n "$delay_pid" ]; then
                kill "$delay_pid" 2>/dev/null || true
                wait "$delay_pid" 2>/dev/null || true
              fi
            ' TERM INT
            while [ "$stop_requested" = 0 ] && kill -0 "$pytest_pid" 2>/dev/null; do
              sleep 120 &
              delay_pid=$!
              wait "$delay_pid" || break
              delay_pid=""
              if kill -0 "$pytest_pid" 2>/dev/null; then
                echo "::group::cross-read native stacks (C-060)"
                timeout --kill-after=5s 30s sudo -n .venv/bin/py-spy dump --pid "$pytest_pid" --native || echo "::warning::Native stack capture failed"
                echo "::endgroup::"
              fi
            done
          ) &
          watchdog_pid=$!
          pytest_status=0
          wait "$pytest_pid" || pytest_status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" || true
          exit "$pytest_status"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-acceptance-cleanup
          mask-aws-account-id: true
      - name: remove this leg's scratch tables
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          RUN_PREFIX: testing_r${{ github.run_id }}a${{ github.run_attempt }}_acc_
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: .venv/bin/python scripts/aws_acceptance_cleanup.py --run-prefix "${RUN_PREFIX}" --execute

  integrity-u:
    name: tier-2 integrity leg U (commit-unknown drills, scratch-only)
    needs: build
    if: github.event_name == 'schedule' || inputs.leg == 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    env:
      REPARK_ACCEPT_RUN_ID: ${{ github.run_id }}
      REPARK_ACCEPT_RUN_ATTEMPT: ${{ github.run_attempt }}
      REPARK_ACCEPT_LEG: u
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acceptance-wheel
          path: wheel
      - name: sync, install the wheel, profiler and boto3
        run: |
          uv sync --locked --extra record --no-install-package repark
          uv pip install --python .venv/bin/python --no-deps wheel/repark-*.whl
          uv pip install --python .venv/bin/python --only-binary :all: py-spy==0.4.1 boto3==1.43.111
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-u
          mask-aws-account-id: true
      - name: integrity leg U (REPARK_AWS_ACCEPTANCE=1, ICE-INTEGRITY-PINS-1)
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest
          python/repark/tests/parity/test_aws_acceptance_commit_unknown.py
          -q -rA
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-u-cross-read
          mask-aws-account-id: true
      - name: cross-read module (REPARK_AWS_ACCEPTANCE=1)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
          SPARK_LOCAL_IP: "127.0.0.1"
        run: |
          .venv/bin/python -u -m pytest python/repark/tests/parity/test_aws_acceptance_cross_read.py -q -rA --capture=tee-sys &
          pytest_pid=$!
          (
            delay_pid=""
            stop_requested=0
            trap '
              stop_requested=1
              if [ -n "$delay_pid" ]; then
                kill "$delay_pid" 2>/dev/null || true
                wait "$delay_pid" 2>/dev/null || true
              fi
            ' TERM INT
            while [ "$stop_requested" = 0 ] && kill -0 "$pytest_pid" 2>/dev/null; do
              sleep 120 &
              delay_pid=$!
              wait "$delay_pid" || break
              delay_pid=""
              if kill -0 "$pytest_pid" 2>/dev/null; then
                echo "::group::cross-read native stacks (C-060)"
                timeout --kill-after=5s 30s sudo -n .venv/bin/py-spy dump --pid "$pytest_pid" --native || echo "::warning::Native stack capture failed"
                echo "::endgroup::"
              fi
            done
          ) &
          watchdog_pid=$!
          pytest_status=0
          wait "$pytest_pid" || pytest_status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" || true
          exit "$pytest_status"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-u-cleanup
          mask-aws-account-id: true
      - name: remove this leg's scratch tables
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          RUN_PREFIX: testing_r${{ github.run_id }}a${{ github.run_attempt }}_u_
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: .venv/bin/python scripts/aws_acceptance_cleanup.py --run-prefix "${RUN_PREFIX}" --execute

  integrity-x:
    name: tier-2 integrity leg X (cross-release, scratch-only)
    needs: build
    if: github.event_name == 'schedule' || inputs.leg == 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    env:
      REPARK_ACCEPT_RUN_ID: ${{ github.run_id }}
      REPARK_ACCEPT_RUN_ATTEMPT: ${{ github.run_attempt }}
      REPARK_ACCEPT_LEG: x
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acceptance-wheel
          path: wheel
      - name: sync, install the wheel, profiler and boto3
        run: |
          uv sync --locked --extra record --no-install-package repark
          uv pip install --python .venv/bin/python --no-deps wheel/repark-*.whl
          uv pip install --python .venv/bin/python --only-binary :all: py-spy==0.4.1 boto3==1.43.111
          uv venv --python 3.12 .venv-previous
          VIRTUAL_ENV="$PWD/.venv-previous" uv pip install --only-binary :all: --require-hashes \
            -r python/repark/tests/parity/previous_release_requirements.txt
          .venv-previous/bin/python -c \
            "import repark; assert repark.__version__ == '1.5.5', repark.__version__"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-x
          mask-aws-account-id: true
      - name: integrity leg X (REPARK_AWS_ACCEPTANCE=1, ICE-INTEGRITY-PINS-1)
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
          REPARK_PREVIOUS_RELEASE_PYTHON: ${{ github.workspace }}/.venv-previous/bin/python
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest
          python/repark/tests/parity/test_aws_acceptance_cross_release.py
          -q -rA
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-x-cross-read
          mask-aws-account-id: true
      - name: cross-read module (REPARK_AWS_ACCEPTANCE=1)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
          SPARK_LOCAL_IP: "127.0.0.1"
        run: |
          .venv/bin/python -u -m pytest python/repark/tests/parity/test_aws_acceptance_cross_read.py -q -rA --capture=tee-sys &
          pytest_pid=$!
          (
            delay_pid=""
            stop_requested=0
            trap '
              stop_requested=1
              if [ -n "$delay_pid" ]; then
                kill "$delay_pid" 2>/dev/null || true
                wait "$delay_pid" 2>/dev/null || true
              fi
            ' TERM INT
            while [ "$stop_requested" = 0 ] && kill -0 "$pytest_pid" 2>/dev/null; do
              sleep 120 &
              delay_pid=$!
              wait "$delay_pid" || break
              delay_pid=""
              if kill -0 "$pytest_pid" 2>/dev/null; then
                echo "::group::cross-read native stacks (C-060)"
                timeout --kill-after=5s 30s sudo -n .venv/bin/py-spy dump --pid "$pytest_pid" --native || echo "::warning::Native stack capture failed"
                echo "::endgroup::"
              fi
            done
          ) &
          watchdog_pid=$!
          pytest_status=0
          wait "$pytest_pid" || pytest_status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" || true
          exit "$pytest_status"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-integrity-x-cleanup
          mask-aws-account-id: true
      - name: remove this leg's scratch tables
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          RUN_PREFIX: testing_r${{ github.run_id }}a${{ github.run_attempt }}_x_
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: .venv/bin/python scripts/aws_acceptance_cleanup.py --run-prefix "${RUN_PREFIX}" --execute

  backstop:
    name: backstop (run prefixes older than 24 hours, scratch-only)
    needs: [acceptance-dbt, integrity-u, integrity-x]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.leg == 'acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: install boto3
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --only-binary :all: boto3==1.43.111
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-backstop
          mask-aws-account-id: true
      - name: remove run prefixes older than 24 hours
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: .venv/bin/python scripts/aws_acceptance_cleanup.py --older-than-hours 24 --execute

  ice-read-perf-bench:
    name: ICE-READ-PERF bench (S3 Tables + Glue, dispatch-only, scratch-only)
    if: github.event_name == 'workflow_dispatch' && inputs.leg == 'ice-read-perf-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    env:
      BENCH_NAMESPACE: testing_repark_acceptance
      BENCH_TABLE: ice_read_perf_bench
      BENCH_REPEAT: "1"
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "the bench runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: build the bench (before any credential exists)
        run: cargo bench --locked -p repark-spark --bench ice_read_perf --no-run
      - name: refuse a missing warehouse or table bucket before signing any request
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: |
          set -euo pipefail
          case "${REPARK_ACCEPT_WAREHOUSE}" in
            "" | "s3://example-warehouse/")
              echo "REPARK_ACCEPT_WAREHOUSE is unset or the placeholder; the bench needs the Glue scratch warehouse (docs/tier2-aws.md §4)" >&2
              exit 1
              ;;
          esac
          if [ -z "${TABLE_BUCKET_ARN}" ]; then
            echo "TABLE_BUCKET_ARN is unset; the bench needs the S3 Tables leg (docs/tier2-aws.md §4)" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/ice-read-perf-out"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-ice-read-perf-bench
          mask-aws-account-id: true
      - name: S3 Tables — create the bench namespace and table (idempotent, R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase create
      - name: S3 Tables — disable AWS-managed compaction and fail unless it reads disabled
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: |
          set -euo pipefail
          stop() {
            {
              echo "ICE-READ-PERF bench stopped before any write: $1."
              echo "A denial means the owner must grant s3tables:PutTableMaintenanceConfiguration and s3tables:GetTableMaintenanceConfiguration on the bench table (docs/tier2-aws.md §2)."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >&2
            exit 1
          }
          aws s3tables put-table-maintenance-configuration \
            --table-bucket-arn "${TABLE_BUCKET_ARN}" \
            --namespace "${BENCH_NAMESPACE}" \
            --name "${BENCH_TABLE}" \
            --type icebergCompaction \
            --value '{"status":"disabled"}' \
            || stop "put-table-maintenance-configuration (icebergCompaction disabled) failed"
          status="$(aws s3tables get-table-maintenance-configuration \
            --table-bucket-arn "${TABLE_BUCKET_ARN}" \
            --namespace "${BENCH_NAMESPACE}" \
            --name "${BENCH_TABLE}" \
            --query 'configuration.icebergCompaction.status' \
            --output text)" \
            || stop "get-table-maintenance-configuration failed"
          if [ "${status}" != "disabled" ]; then
            stop "icebergCompaction reads '${status}', not disabled"
          fi
          echo "S3 Tables icebergCompaction on ${BENCH_NAMESPACE}.${BENCH_TABLE}: disabled (read back)" >> "${GITHUB_STEP_SUMMARY}"
      - name: S3 Tables — write the bed only into an empty table (R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase write
      - name: Glue — create the bench namespace and table (idempotent, R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase create
      - name: Glue — write the bed only into an empty table (R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
        run: |
          set -euo pipefail
          echo "Glue: this workflow makes no table-optimizer call; Glue compaction stays off unless someone enables the optimizer on ${BENCH_NAMESPACE}.${BENCH_TABLE}." >> "${GITHUB_STEP_SUMMARY}"
          cargo bench --locked -p repark-spark --bench ice_read_perf -- \
            setup --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}" \
            --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase write
      - name: S3 Tables — cold, warm, concurrent, concurrent-cold (each R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          baseline_flags=()
          if [ "${BASELINE}" = "true" ]; then
            baseline_flags=(--baseline)
          fi
          for mode in cold warm concurrent concurrent-cold; do
            cargo bench --locked -p repark-spark --bench ice_read_perf -- \
              run --mode "${mode}" --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}" \
              --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --repeat "${BENCH_REPEAT}" \
              --out "${RUNNER_TEMP}/ice-read-perf-out/s3tables-${mode}.json" "${baseline_flags[@]}"
          done
      - name: Glue — cold, warm, concurrent, concurrent-cold (each R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          baseline_flags=()
          if [ "${BASELINE}" = "true" ]; then
            baseline_flags=(--baseline)
          fi
          for mode in cold warm concurrent concurrent-cold; do
            cargo bench --locked -p repark-spark --bench ice_read_perf -- \
              run --mode "${mode}" --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}" \
              --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --repeat "${BENCH_REPEAT}" \
              --out "${RUNNER_TEMP}/ice-read-perf-out/glue-${mode}.json" "${baseline_flags[@]}"
          done
      - name: bytes read per run and for the dispatch
        if: ${{ !cancelled() }}
        env:
          PURPOSE: ${{ inputs.purpose }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          total=0
          {
            echo "## ICE-READ-PERF bench — purpose: ${PURPOSE:-unstated} baseline=${BASELINE:-false}"
            for file in "${RUNNER_TEMP}"/ice-read-perf-out/*.json; do
              bytes="$(jq '.run_io_total.bytes' "${file}")"
              total=$((total + bytes))
              echo "- $(basename "${file}" .json): ${bytes} bytes read"
            done
            echo "- dispatch total: ${total} bytes read"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: ice-read-perf-bench
          path: ${{ runner.temp }}/ice-read-perf-out/
          if-no-files-found: warn
          retention-days: 30
