# This is the only live-AWS workflow. It runs merged code nightly or manually through OIDC on a
# GitHub-hosted runner; it is never a required check and puts no secrets in tier 1.
# `environment: aws-acceptance` supplies human approval and the main-only deployment policy. The
# in-file ref guard and IAM subject do not establish that branch boundary.
# Mint credentials only after checkout, tool setup, dependency sync, and the native build. Mask the
# account ID so tracebacks cannot expose ARNs in the public log.
# The role cannot delete Glue tables or databases. It can delete objects only under the warehouse
# scratch prefix for maintenance; lifecycle policy cleans accumulated scratch tables.
# Run only the acceptance module. Refuse placeholder buckets before signing requests. A missing
# TABLE_BUCKET_ARN skips the S3 Tables leg.
# docs/tier2-aws.md owns operator inputs and setup. Local checks cannot prove environment approval,
# OIDC exchange, or scheduling; the first manual run is the post-merge acceptance proof.
name: aws-acceptance

on:
  schedule:
    - cron: "43 8 * * *"  # nightly ~08:43 UTC — offset from the parity cron (07:17)
  workflow_dispatch:
    inputs:
      leg:
        description: "acceptance (the nightly module) or ice-read-perf-bench (the read bench, docs/tier2-aws.md §8)"
        type: choice
        options:
          - acceptance
          - ice-read-perf-bench
        default: acceptance
      purpose:
        description: "why this dispatch runs (the unit it measures), echoed into the job summary"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: aws-acceptance-${{ github.workflow }}
  cancel-in-progress: false  # never cancel a live-AWS run mid-commit; runs serialize instead

jobs:
  live-aws:
    name: tier-2 live AWS acceptance (Glue + S3 Tables, scratch-only)
    if: github.event_name == 'schedule' || inputs.leg == 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-acceptance
    permissions:
      id-token: write   # OIDC exchange — scoped to this job only
      contents: read
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "tier-2 runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Python 3.12 WITH libpython so the PyO3 cdylib links during `maturin develop`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 (node24)
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      # Build BEFORE credentials exist — a supply-chain payload in this step has no AWS session.
      - name: sync + build native module
        run: |
          # --locked: uv.lock is an INPUT, never an output — a bare sync may rewrite the
          # checked-in lockfile as a side effect of a CI run (same rule as parity-live.yml).
          uv sync --locked
          (cd python/repark && uvx maturin@1.14.1 develop)
          VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet dbt-core==1.9.11 dbt-spark==1.9.3
      # Credentials mint HERE, last, immediately before the only step that needs them.
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-tier2-acceptance
          mask-aws-account-id: true
      # Run only the scratch-scoped module; Glue deletion stays denied and placeholder buckets
      # fail loud. `VIRTUAL_ENV` keeps the maturin build authoritative.
      - name: acceptance module (REPARK_AWS_ACCEPTANCE=1)
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest python/repark/tests/test_aws_acceptance.py -q -rA
      - name: dbt gold acceptance (REPARK_AWS_ACCEPTANCE=1)
        if: ${{ !cancelled() }}
        env:
          REPARK_AWS_ACCEPTANCE: "1"
          REPARK_ACCEPT_DS: ${{ vars.REPARK_ACCEPT_DS }}
          REPARK_ACCEPT_ENTITY: ${{ vars.REPARK_ACCEPT_ENTITY }}
          REPARK_ACCEPT_ID_COL: ${{ vars.REPARK_ACCEPT_ID_COL }}
          REPARK_ACCEPT_BRONZE_BUCKET: ${{ vars.REPARK_ACCEPT_BRONZE_BUCKET }}
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          VIRTUAL_ENV="$PWD/.venv"
          uv run --no-project python -m pytest python/dbt-repark/tests/test_aws_acceptance_gold.py -q -rA

  ice-read-perf-bench:
    name: ICE-READ-PERF bench (S3 Tables + Glue, dispatch-only, scratch-only)
    if: github.event_name == 'workflow_dispatch' && inputs.leg == 'ice-read-perf-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: aws-acceptance
    permissions:
      id-token: write
      contents: read
    env:
      BENCH_NAMESPACE: testing_repark_acceptance
      BENCH_TABLE: ice_read_perf_bench
      BENCH_REPEAT: "3"
    steps:
      - name: refuse non-default-branch refs (defence in depth; the branch gate is the environment)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "the bench runs against merged code only; refusing ref '${GITHUB_REF}'" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: build the bench (before any credential exists)
        run: cargo bench --locked -p repark-spark --bench ice_read_perf --no-run
      - name: refuse a missing warehouse or table bucket before signing any request
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${REPARK_ACCEPT_WAREHOUSE}" ] || [ "${REPARK_ACCEPT_WAREHOUSE}" = "s3://example-warehouse/" ]; then
            echo "REPARK_ACCEPT_WAREHOUSE is unset or the placeholder; the bench needs the Glue scratch warehouse (docs/tier2-aws.md §4)" >&2
            exit 1
          fi
          if [ -z "${TABLE_BUCKET_ARN}" ]; then
            echo "TABLE_BUCKET_ARN is unset; the bench needs the S3 Tables leg (docs/tier2-aws.md §4)" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/ice-read-perf-out"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ACCEPTANCE_REGION }}
          role-session-name: repark-ice-read-perf-bench
          mask-aws-account-id: true
      - name: S3 Tables — create the bench namespace and table (idempotent, R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase create
      - name: S3 Tables — disable AWS-managed compaction and fail unless it reads disabled
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: |
          set -euo pipefail
          stop() {
            {
              echo "ICE-READ-PERF bench stopped before any write: $1."
              echo "A denial means the owner must grant s3tables:PutTableMaintenanceConfiguration and s3tables:GetTableMaintenanceConfiguration on the bench table (docs/tier2-aws.md §2)."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >&2
            exit 1
          }
          aws s3tables put-table-maintenance-configuration \
            --table-bucket-arn "${TABLE_BUCKET_ARN}" \
            --namespace "${BENCH_NAMESPACE}" \
            --name "${BENCH_TABLE}" \
            --type icebergCompaction \
            --value '{"status":"disabled"}' \
            || stop "put-table-maintenance-configuration (icebergCompaction disabled) failed"
          status="$(aws s3tables get-table-maintenance-configuration \
            --table-bucket-arn "${TABLE_BUCKET_ARN}" \
            --namespace "${BENCH_NAMESPACE}" \
            --name "${BENCH_TABLE}" \
            --query 'configuration.icebergCompaction.status' \
            --output text)" \
            || stop "get-table-maintenance-configuration failed"
          if [ "${status}" != "disabled" ]; then
            stop "icebergCompaction reads '${status}', not disabled"
          fi
          echo "S3 Tables icebergCompaction on ${BENCH_NAMESPACE}.${BENCH_TABLE}: disabled (read back)" >> "${GITHUB_STEP_SUMMARY}"
      - name: S3 Tables — write the bed only into an empty table (R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase write
      - name: Glue — create the bench namespace and table (idempotent, R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
        run: >
          cargo bench --locked -p repark-spark --bench ice_read_perf --
          setup --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}"
          --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase create
      - name: Glue — write the bed only into an empty table (R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
        run: |
          set -euo pipefail
          echo "Glue: this workflow makes no table-optimizer call; Glue compaction stays off unless someone enables the optimizer on ${BENCH_NAMESPACE}.${BENCH_TABLE}." >> "${GITHUB_STEP_SUMMARY}"
          cargo bench --locked -p repark-spark --bench ice_read_perf -- \
            setup --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}" \
            --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --phase write
      - name: S3 Tables — cold, warm, concurrent, concurrent-cold (each R-3 checked)
        env:
          TABLE_BUCKET_ARN: ${{ secrets.TABLE_BUCKET_ARN }}
        run: |
          set -euo pipefail
          for mode in cold warm concurrent concurrent-cold; do
            cargo bench --locked -p repark-spark --bench ice_read_perf -- \
              run --mode "${mode}" --catalog s3tables --prop "table_bucket_arn=${TABLE_BUCKET_ARN}" \
              --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --repeat "${BENCH_REPEAT}" \
              --out "${RUNNER_TEMP}/ice-read-perf-out/s3tables-${mode}.json"
          done
      - name: Glue — cold, warm, concurrent, concurrent-cold (each R-3 checked)
        env:
          REPARK_ACCEPT_WAREHOUSE: ${{ vars.REPARK_ACCEPT_WAREHOUSE }}
        run: |
          set -euo pipefail
          for mode in cold warm concurrent concurrent-cold; do
            cargo bench --locked -p repark-spark --bench ice_read_perf -- \
              run --mode "${mode}" --catalog glue --prop "warehouse=${REPARK_ACCEPT_WAREHOUSE}" \
              --table "${BENCH_NAMESPACE}.${BENCH_TABLE}" --repeat "${BENCH_REPEAT}" \
              --out "${RUNNER_TEMP}/ice-read-perf-out/glue-${mode}.json"
          done
      - name: bytes read per run and for the dispatch
        if: ${{ !cancelled() }}
        env:
          PURPOSE: ${{ inputs.purpose }}
        run: |
          set -euo pipefail
          total=0
          {
            echo "## ICE-READ-PERF bench — purpose: ${PURPOSE:-unstated}"
            for file in "${RUNNER_TEMP}"/ice-read-perf-out/*.json; do
              [ -e "${file}" ] || continue
              bytes="$(jq '.run_io_total.bytes' "${file}")"
              total=$((total + bytes))
              echo "- $(basename "${file}" .json): ${bytes} bytes read"
            done
            echo "- dispatch total: ${total} bytes read"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: ice-read-perf-bench
          path: ${{ runner.temp }}/ice-read-perf-out/
          if-no-files-found: warn
          retention-days: 30
