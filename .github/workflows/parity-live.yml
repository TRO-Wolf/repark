# Nightly and manual runs compare repark, pinned goldens, and live Spark 4.1.2 on merged code only.
# `make parity-live` proves the commands locally; GitHub scheduling remains a post-merge check.
name: parity-live

on:
  schedule:
    - cron: "17 7 * * *"  # nightly ~07:17 UTC (off the hour to dodge the cron stampede)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-oracle:
    name: live PySpark oracle (facade + REPARK_PARITY_LIVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Java 17 (Temurin) — Spark 4.1.2 requires it. SHA-pinned like every third-party action.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Python 3.12 WITH libpython so the PyO3 cdylib links during `maturin develop`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # SHA-pinned: dtolnay/rust-toolchain refs are branches (not tags); the `toolchain:` input
      # below selects the compiler. Needed because `maturin develop` compiles the cdylib.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.2 (node24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      # Keep every sync and run flag identical to `make parity-live`; each prevents lock mutation,
      # missing optional cohorts, or the source package from shadowing the maturin build.
      # V3E-5 (2026-08-27): verify the Spark-written v3 fixtures that the nightly live tier exercises are present.
      - name: verify v3 fixtures present for live oracle (V3E-5)
        run: ls crates/repark-spark/src/tests/fixtures/v3-spark-part-dv/metadata/v3.metadata.json crates/repark-spark/src/tests/fixtures/v3-spark-eq-dv/metadata/v4.metadata.json
      - name: sync record + facade extras (pyspark 4.1.2) + build native module
        run: |
          uv sync --locked --extra record \
            --extra numpy --extra pandas --extra polars --extra ml-ext \
            --no-install-package repark
          (cd python/repark && uvx maturin@1.14.1 develop)
      - name: Runner attribution
        run: |
          java -version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          uv run --locked --no-sync python --version
          uv pip freeze
      # REPARK_PARITY_LIVE and the JVM arm the live oracle; SPARK_LOCAL_IP keeps its local driver
      # deterministic.
      - name: facade suite + live oracle tier (REPARK_PARITY_LIVE=1)
        env:
          REPARK_PARITY_LIVE: "1"
          SPARK_LOCAL_IP: "127.0.0.1"
        run: uv run --locked --no-sync pytest python/repark/tests -q
