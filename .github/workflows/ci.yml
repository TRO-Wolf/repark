# Main PR gate (tier 1: every PR, no secrets, GitHub-hosted, read-only token).
# Rust lint (fmt + clippy + check) + Rust test (workspace) as separate jobs, Python (ruff), and
# the repo guards (map.md + workflow parse + crate dependency policy + lib.rs thinness +
# the structural manifest).
# Note on `cargo test --locked --workspace` (not `--all-features`): `--all-features` would enable
# the repark-python `extension-module` feature, which tells PyO3 not to link libpython — fine for
# a wheel, but it breaks linking a standalone test binary. See AGENTS.md "PyO3 build notes"
# (applies from phase 3; the rule is enforced from day one so it never regresses).
#
# Phase-1 shape: the workspace has members and every job is always-on. The v1 diff-classifier
# (`detect`) that path-filtered the heavy jobs stays deferred — it returns when rust-test
# exceeds ~3 min (recorded in workflows/map.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch run, so main keeps an
  # unbroken record (same convention as the sibling workflows).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Phase-3 arming (docs/design/python-facade.md §7): lint and test are SPLIT into two jobs with
  # one cache prefix each and a fresh disk each — the combined job restoring both prefixes onto
  # one runner disk is the exact configuration v1 outgrew (ENOSPC + ld SIGBUS, three incidents).
  # Both jobs install Python 3.12 (libpython) so the PyO3 cdylib links the day repark-python
  # lands. No debuginfo, no incremental: CI never reuses it and it ~doubles artifact size.
  rust-lint:
    name: Rust lint (fmt + clippy + check)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      # Provides a Python 3.12 with libpython so the PyO3 cdylib links (from phase 3 on).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # SHA-pinned: dtolnay/rust-toolchain refs are branches (not tags), so a floating ref would
      # run unreviewed action code forever. The `toolchain:` input below selects the compiler.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-11
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      # Prefix-keyed per dependency family. `shared-key` is load-bearing: rust-cache otherwise
      # mixes the JOB ID into the key, so cache-warm.yml's warm-lint saves would land under keys
      # this job never restores. prefix-key AND shared-key MUST match warm-lint.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          prefix-key: "v2-df54"
          shared-key: "lint"
      # Dual-wired through the Makefile targets so local == CI by construction: the targets carry
      # the deliberate clippy split (general gate with -A clippy::disallowed_methods; the
      # panic-ban target is the only place clippy.toml's disallowed-methods list is live,
      # --lib --bins).
      - name: rustfmt
        run: make rust-fmt-check
      - name: clippy
        run: make rust-clippy
      - name: panic-ban
        run: make rust-panic-ban
      - name: check
        run: make rust-check
      - name: disk after
        if: always()
        run: df -h /

  rust-test:
    name: Rust test (workspace)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      # Provides a Python 3.12 with libpython so the PyO3 cdylib links during `cargo test`.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # SHA-pinned (see rust-lint).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-11
        with:
          toolchain: "1.96.0"
      # prefix-key AND shared-key MUST match cache-warm.yml's warm-test job (see rust-lint note).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          prefix-key: "v2-df54-test"
          shared-key: "test"
      - name: test
        run: make rust-test
      - name: disk after
        if: always()
        run: df -h /

  guards:
    name: Repo guards (map.md + workflow parse + crate-DAG + lib.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Needed by the crate-DAG guard: its wrapper runs `cargo metadata --locked` (a manifest
      # read, no build). SHA-pinned — see the rust job note.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      - name: map.md guard
        run: bash scripts/check_map_md.sh
      # Crate dependency-policy guard: a ~0.07 s `cargo metadata` read with no build, so an
      # undeclared edge, a wrong dependency kind or a layering inversion fails in seconds rather
      # than after minutes of compilation. Dual-wired with `make check-crate-dag` (ci.yml runs
      # raw commands and never invokes `make ci`, so the gate needs wiring in both places).
      # Tier map + roles + allowed-edge table SSOT: scripts/check_crate_dag.py.
      - name: crate-DAG layering guard
        run: ./scripts/check_crate_dag.sh
      # Structural-manifest guard: repo-manifest.toml must agree with the Cargo workspace, the
      # declared documents, the canonical make targets, STATUS.md and the crate-root map.md
      # files. Pure text (no cargo, no network). Dual-wired with `make check-manifest`.
      # SSOT: repo-manifest.toml + scripts/check_manifest.py.
      - name: repo-manifest guard (check_manifest)
        run: ./scripts/check_manifest.sh
      # lib.rs thinness (no inline #[cfg(test)] mod {…}; line ceilings).
      # Dual-wired with `make check-lib-rs` / `make ci`. SSOT: scripts/check_lib_rs.py.
      - name: lib.rs thinness guard (check_lib_rs)
        run: ./scripts/check_lib_rs.sh
      # parity-live dual-wire: Makefile `parity-live` ↔ parity-live.yml load-bearing flags must
      # agree (uv sync extras, --no-install-package, maturin pin, uv run --locked --no-sync,
      # env pins). Compares the two surfaces to each other — never a third list. Fail-closed.
      # Dual-wired with `make check-parity-live-dual-wire` / `make ci`.
      # SSOT: scripts/check_parity_live_dual_wire.py.
      - name: parity-live dual-wire guard
        run: ./scripts/check_parity_live_dual_wire.sh
      # zizmor SKIPS files it cannot parse ("collection yielded no auditable inputs", exit 0), so
      # a workflow with broken YAML passes the security gate while GitHub silently never runs it.
      # Mirrors `make workflows-parse`.
      - name: workflow parse guard
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_workflows_parse.py

  python:
    # Renamed from "Python (ruff)" at phase-3 PR-4 (the job now also gates the lockfile and
    # the parity harness) — the required-status context updates in the same change.
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      - name: ruff check
        run: uvx ruff@0.15.22 check .
      - name: ruff format --check
        run: uvx ruff@0.15.22 format --check .
      # Python thinness guard (mirrors `make check-lib-py`; ceilings + EXCEPTIONS SSOT:
      # scripts/check_lib_py.py). Returned with the facade at phase-3 PR-5.
      - name: Python thinness guard (check_lib_py)
        run: ./scripts/check_lib_py.sh
      # Lockfile-freshness gate (mirrors `make py-lock-check`): RED if uv.lock lags its
      # pyproject floors. Validates only — never rewrites the lock.
      - name: uv lock --locked
        run: uv lock --locked
      # Parity-harness tests (mirrors `make py-test`): the comparison core + census-machinery
      # unit tests. Cheap enough to run on every event.
      - name: parity-harness tests
        run: >
          PYTHONPATH=python/repark-parity/src
          uv run --no-project --with pyarrow --with pytest
          pytest python/repark-parity/tests -q
