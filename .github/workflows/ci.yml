# Tier-1 PR gate: always-on, read-only, and secret-free. Use workspace tests without all features
# because PyO3's `extension-module` feature cannot link a standalone test binary.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch run, so main keeps an
  # unbroken record (same convention as the sibling workflows).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Separate lint and test caches prevent runner disk exhaustion. Both jobs need Python 3.12 to
  # link PyO3; discarded CI trees do not need debug data or incremental artifacts.
  rust-lint:
    name: Rust lint (fmt + clippy + check)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      # Provides a Python 3.12 with libpython so the PyO3 cdylib links (from phase 3 on).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # SHA-pinned: dtolnay/rust-toolchain refs are branches (not tags), so a floating ref would
      # run unreviewed action code forever. The `toolchain:` input below selects the compiler.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-11
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      # Both keys must match cache-warm.yml; rust-cache otherwise adds the job ID and misses the
      # warm cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 (node24)
        with:
          prefix-key: "v2-df54"
          shared-key: "lint"
      # Use the Makefile targets so local and CI keep the same clippy split and panic ban.
      - name: rustfmt
        run: make rust-fmt-check
      - name: clippy
        run: make rust-clippy
      - name: panic-ban
        run: make rust-panic-ban
      - name: check
        run: make rust-check
      - name: disk after
        if: always()
        run: df -h /

  rust-test:
    name: Rust test (workspace)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      # Provides a Python 3.12 with libpython so the PyO3 cdylib links during `cargo test`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # SHA-pinned (see rust-lint).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-11
        with:
          toolchain: "1.96.0"
      # prefix-key AND shared-key MUST match cache-warm.yml's warm-test job (see rust-lint note).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2 (node24)
        with:
          prefix-key: "v2-df54-test"
          shared-key: "test"
      - name: test
        run: make rust-test
      # This gate needs the test binaries from this job. It keeps every matrix.rs test citation
      # live and mirrors `make check-matrix-test-liveness`.
      - name: matrix test-name liveness
        run: ./scripts/check_matrix_test_liveness.sh
      - name: disk after
        if: always()
        run: df -h /

  guards:
    # The display name is a required status check in branch protection — keyed by this exact
    # string. Add steps below freely; renaming the job leaves the PR "waiting for status".
    name: Repo guards (map.md + workflow parse + crate-DAG + lib.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # check-ledgers diffs the frozen ledger bins against the merge-base with origin/main;
          # a shallow checkout has no origin/main and the guard refuses to pass closed (exit 2).
          fetch-depth: 0
      # Needed by the crate-DAG guard: its wrapper runs `cargo metadata --locked` (a manifest
      # read, no build). SHA-pinned — see the rust job note.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      - name: map.md guard
        run: bash scripts/check_map_md.sh
      # Mirror `make check-crate-dag`; scripts/check_crate_dag.py owns tiers, roles, and allowed
      # dependency kinds.
      - name: crate-DAG layering guard
        run: ./scripts/check_crate_dag.sh
      # Mirror `make check-manifest`; repo-manifest.toml and scripts/check_manifest.py own the
      # structural inventory.
      - name: repo-manifest guard (check_manifest)
        run: ./scripts/check_manifest.sh
      # lib.rs thinness (no inline #[cfg(test)] mod {…}; line ceilings).
      # Dual-wired with `make check-lib-rs` / `make ci`. SSOT: scripts/check_lib_rs.py.
      - name: lib.rs thinness guard (check_lib_rs)
        run: ./scripts/check_lib_rs.sh
      # Per-file crates/**/*.rs line ceilings (default + EXCEPTIONS; ratchet down only).
      # Dual-wired with `make check-rust-file-size` / `make ci`. SSOT: scripts/check_rust_file_size.py.
      - name: rust file-size guard (check_rust_file_size)
        run: ./scripts/check_rust_file_size.sh
      # Compare parity-live.yml directly with the Makefile target and fail closed on any required
      # flag mismatch. Mirror `make check-parity-live-dual-wire`.
      - name: parity-live dual-wire guard
        run: ./scripts/check_parity_live_dual_wire.sh
      # Every map link must resolve. Mirror `make check-map-sync` and the pre-commit guard.
      - name: map.md link-validity guard (sync_map_md)
        run: python3 scripts/sync_map_md.py --check
      # Full history lets the ledger guard reject wrong bins, dead links, and edits to frozen
      # records. Mirror `make check-ledgers`.
      - name: ledger lifecycle guard (check_ledgers)
        run: python3 scripts/ledger_lifecycle.py check
      # Keep live ledger clauses, pins, attestations, and exception ratchets valid. Mirror
      # `make check-ledger-grammar`.
      - name: ledger grammar guard (check_ledger_grammar)
        run: python3 scripts/check_ledger_grammar.py
      # Reject stale workstream blocks and size regressions in live state documents. Mirror
      # `make check-docs-compaction`.
      - name: live-document guard (check_docs_compaction)
        run: python3 scripts/check_docs_compaction.py

      - name: owner-ruling preservation guard (check_owner_ruling)
        run: python3 scripts/check_owner_ruling.py
      # Parse first because zizmor exits successfully when broken YAML yields no auditable input.
      - name: workflow parse guard
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_workflows_parse.py

  python:
    # Renamed from "Python (ruff)" at phase-3 PR-4 (the job now also gates the lockfile and
    # the parity harness) — the required-status context updates in the same change.
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
          python-version: "3.12"
          enable-cache: true
      - name: ruff check
        run: uvx ruff@0.15.22 check .
      - name: ruff format --check
        run: uvx ruff@0.15.22 format --check .
      # Python source-size and facade thinness guard (mirrors `make check-lib-py`; exact
      # baselines + EXCEPTIONS SSOT: scripts/check_lib_py.py).
      - name: Python source-size and facade thinness guard (check_lib_py)
        run: ./scripts/check_lib_py.sh

      - name: Python conventions guard (check_python_conventions)
        run: ./scripts/check_python_conventions.sh
      - name: Python docstring-presence guard (check_docstring_presence)
        run: ./scripts/check_docstring_presence.sh
      # Mirror `make check-example-coverage`. This job does not build the native
      # module, so example execution is skipped; wheels.yml smoke requires it.
      - name: example-coverage guard (check_example_coverage)
        run: ./scripts/check_example_coverage.sh
      # Lockfile-freshness gate (mirrors `make py-lock-check`): RED if uv.lock lags its
      # pyproject floors. Validates only — never rewrites the lock.
      - name: uv lock --locked
        run: uv lock --locked
      # Mirror `make py-test`; `--no-project` requires pydantic to be supplied explicitly.
      - name: parity-harness tests
        run: >
          PYTHONPATH=python/repark-parity/src
          uv run --no-project --with pyarrow --with pytest --with 'pydantic>=2.10,<3'
          pytest python/repark-parity/tests -q
