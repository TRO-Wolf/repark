# License compliance, banned/duplicate crates, and source restrictions (config in deny.toml).
# Run on the host runner (not the cargo-deny Docker action): that action runs in a musl container
# that can't honor this repo's pinned rust-toolchain.toml, which fails before any check runs.
name: cargo-deny

on:
  push:
    branches: [main]  # PR coverage comes from `pull_request`; this avoids the double run
    paths: ["**/Cargo.toml", "**/Cargo.lock", "deny.toml", ".github/workflows/cargo-deny.yml"]
  pull_request:
    # No `paths:` filter — required status check; a path-filtered required check never runs on
    # non-matching PRs, leaving them permanently BLOCKED (task/lessons.md 2026-08-07). The
    # `push` trigger above stays filtered: main-branch runs are record-keeping, not merge gates.

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch or scheduled run, so
  # main keeps an unbroken record. Without this, three quick pushes stacked three full runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # SHA-pinned: dtolnay/rust-toolchain refs are branches (not tags), so a floating ref would
      # run unreviewed action code forever. The `toolchain:` input below selects the compiler.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-11
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8  # v2
        with:
          tool: cargo-deny@0.19.9
      - run: cargo deny check all
