# Spell-check (config in .typos.toml). Runs the same uvx-pinned typos as `make spell-check` —
# bump the version here and in the Makefile pin in the same change.
name: typos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch or scheduled run, so
  # main keeps an unbroken record. Without this, three quick pushes stacked three full runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
      - name: typos
        run: uvx typos@1.47.2
