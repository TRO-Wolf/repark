# Tags build a cold manylinux wheel and publish it through environment-bound PyPI OIDC.
# crates.io stays deferred while `[patch.crates-io]` supplies the owned Iceberg fork.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-wheel:
    name: build release wheel (manylinux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "v1.14.1" # Makefile MATURIN pin
          command: build
          args: --release --out dist
          working-directory: python/repark
          manylinux: auto
          sccache: "false"
      - name: tag/version consistency
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          wheel=$(ls python/repark/dist/repark-*.whl)
          case "$wheel" in
            *"repark-${tag}-"*) echo "wheel matches tag v${tag}" ;;
            *) echo "TAG/VERSION MISMATCH: tag v${tag} vs wheel $wheel (bump the workspace version in Cargo.toml before tagging)" >&2; exit 1 ;;
          esac
      - name: import smoke (release wheel, explicit path)
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet python/repark/dist/repark-*.whl
          /tmp/smoke-venv/bin/python -c "import repark; assert callable(repark.sql); from repark.spark import ReparkSession; print('release wheel OK', repark.__version__)"
          if /tmp/smoke-venv/bin/python -c "import repark.sql" 2>/dev/null; then
            echo "release checklist violation: import repark.sql must fail" >&2; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: release-wheel
          path: python/repark/dist/repark-*.whl
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          name: release-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
