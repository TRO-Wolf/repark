# Release publishing — tag-triggered, PyPI via trusted publishing (OIDC). Armed at the first
# tagged release per docs/release.md; runs only on `v*` tags, never on branches or PRs.
#
# Design notes (docs/release.md is the runbook):
#   - `environment: release` binds the publish job to a GitHub environment so the owner can
#     attach required reviewers / protection before any upload happens.
#   - `id-token: write` is scoped to the publish job ONLY (OIDC exchange with PyPI); every other
#     permission stays read. No long-lived registry token exists anywhere.
#   - The build job mirrors wheels.yml `release-wheels` (maturin pin, manylinux, NO cache
#     restore — zizmor cache-poisoning: published artifacts never rebuild from prior CI state).
#   - crates.io publishing is DEFERRED: the `[patch.crates-io]` iceberg-fork rev cannot ship in
#     a published crate (registry consumers would resolve unpatched iceberg 0.9.1 and lose the
#     fork surface). See docs/release.md "crates.io — Trusted Publishing" for the unblock path.
#   - The wheel uploads by explicit dist/ path — never by bare package name (wheels.yml lesson:
#     the 0.0.1 name-reservation outversions local wheels).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-wheel:
    name: build release wheel (manylinux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679bfd44e6c58ca4b311c012752d0c8944636d # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "v1.14.1" # Makefile MATURIN pin
          command: build
          args: --release --out dist
          working-directory: python/repark
          manylinux: auto
          sccache: "false"
      - name: tag/version consistency
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          wheel=$(ls python/repark/dist/repark-*.whl)
          case "$wheel" in
            *"repark-${tag}-"*) echo "wheel matches tag v${tag}" ;;
            *) echo "TAG/VERSION MISMATCH: tag v${tag} vs wheel $wheel (bump the workspace version in Cargo.toml before tagging)" >&2; exit 1 ;;
          esac
      - name: import smoke (release wheel, explicit path)
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet python/repark/dist/repark-*.whl
          /tmp/smoke-venv/bin/python -c "import repark; assert callable(repark.sql); from repark.spark import ReparkSession; print('release wheel OK', repark.__version__)"
          if /tmp/smoke-venv/bin/python -c "import repark.sql" 2>/dev/null; then
            echo "release checklist violation: import repark.sql must fail" >&2; exit 1
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-wheel
          path: python/repark/dist/repark-*.whl
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3
        with:
          packages-dir: dist
