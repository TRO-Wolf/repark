# Static security analysis of the GitHub Actions workflows themselves (zizmor). Publishes SARIF
# as a build artifact for triage.
name: zizmor

on:
  push:
    branches: [main]  # PR coverage comes from `pull_request`; this avoids the double run
    paths: [".github/workflows/**", ".github/zizmor.yml"]
  pull_request:
    # Required PR checks cannot use path filters; non-matching PRs would wait forever. The filtered
    # push trigger is only a main-branch record.

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a main-branch or scheduled run, so
  # main keeps an unbroken record. Without this, three quick pushes stacked three full runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.0.1 (node24)
        with:
          version: "0.9.5"  # Makefile UV_VERSION
      - name: Run zizmor
        run: uvx zizmor@1.26.1 .
      - name: zizmor SARIF
        if: always()
        run: uvx zizmor@1.26.1 --format sarif . > zizmor.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()  # upload the SARIF for triage even when the gate fails
        with:
          name: zizmor-sarif
          path: zizmor.sarif
