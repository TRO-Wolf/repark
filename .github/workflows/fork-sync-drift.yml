# Fork-sync drift report — read-only observability for the TRO-Wolf/iceberg-rust pin.
# Weekly (+ dispatch) answers to the three questions nobody should have to remember to ask:
# how far is the fork's main past the [patch.crates-io] pin, how far has apache/iceberg-rust
# moved past the fork's merge-base, and is the pinned rev still reachable. The sync contract
# (who bumps, when, thresholds) is docs/fork-sync.md. No secrets; writes nothing anywhere —
# the run summary IS the report.
name: fork-sync-drift

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned rev (single-writer-per-pin invariant)
        run: |
          set -euo pipefail
          revs=$(grep -oE 'rev = "[0-9a-f]{40}"' Cargo.toml | sort -u)
          count=$(printf '%s\n' "$revs" | wc -l)
          if [ "$count" -ne 1 ]; then
            {
              echo "## Fork-sync drift — PIN INVARIANT BROKEN"
              echo
              echo "Expected exactly one distinct \`rev\` across the \`[patch.crates-io]\` family, found ${count}:"
              echo '```'
              printf '%s\n' "$revs"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          pin=$(printf '%s' "$revs" | grep -oE '[0-9a-f]{40}')
          echo "PIN=$pin" >> "$GITHUB_ENV"

      - name: Measure drift
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/TRO-Wolf/iceberg-rust /tmp/fork
          cd /tmp/fork
          git remote add upstream https://github.com/apache/iceberg-rust
          git fetch --quiet upstream main
          {
            echo "## Fork-sync drift — $(date -u +%F)"
            echo
            echo "| Question | Answer |"
            echo "|---|---|"
            if git cat-file -e "${PIN}^{commit}" 2>/dev/null; then
              echo "| Pinned rev reachable in fork | yes (\`$(printf '%.12s' "$PIN")\`) |"
              echo "| Fork main ahead of pin | $(git rev-list --count "$PIN"..origin/main) commits |"
            else
              echo "| Pinned rev reachable in fork | **NO — pin orphaned; hard stop, investigate** |"
            fi
            base=$(git merge-base origin/main upstream/main)
            echo "| Upstream ahead of fork (from merge-base) | $(git rev-list --count "$base"..upstream/main) commits |"
            echo "| Fork carries over upstream | $(git rev-list --count "$base"..origin/main) commits |"
            echo
            echo "Soft thresholds (docs/fork-sync.md): fork >10 ahead of pin → pin bump;"
            echo "upstream >50 ahead of fork → fork-side upstream merge. Orphaned pin = hard stop."
          } >> "$GITHUB_STEP_SUMMARY"
