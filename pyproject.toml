# uv workspace root (virtual — not itself a package). Members are the Python projects under
# python/. One shared uv.lock + .venv. Python floor 3.12 (.python-version). Ruff is the single
# lint+format tool.

[tool.uv.workspace]
members = ["python/repark", "python/repark-parity"]

[dependency-groups]
# pandas is here so the facade's toPandas/to_pandas tests run; numpy arrives via pyarrow/pandas.
# duckdb backs the bench comparison scripts.
dev = ["ruff>=0.15.22,<0.16", "pytest>=9.1.1", "maturin>=1.14.1,<2", "pandas>=2.1", "duckdb==1.5.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/repark/src", "python/repark-parity/src"]

[tool.ruff.lint]
# Pragmatic-but-strict default. Annotations (ANN) enforce the "type hints on every signature"
# convention; pyupgrade (UP), bugbear (B), simplify (SIM), pathlib (PTH), naming (N) cover the rest.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF", "N", "ANN", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# PYC-4 split the tests glob so parity tests see ANN201/ANN202. PYC-5 dropped
# facade ANN201 (isolated count was 0). ANN202 stays (private helpers).
# Argument annotations on tests stay ignored (pytest fixtures).
"python/repark/tests/**" = ["ANN202", "ANN001", "S101"]
"python/repark-parity/tests/**" = ["ANN001", "S101"]
# repark.ml mirrors pyspark.ml camelCase API (toArray, saveImpl, getOrDefault, …)
# and Spark-shaped Generic type vars; do not rename for PEP8.
"python/repark/src/repark/spark/ml/**" = ["N802", "UP046"]
# r26 T1 package split: free funcs + class modules use dynamic name binding /
# intentional re-exports; import * and F821 are load-bearing.
"python/repark/src/repark/spark/session/**" = ["F401", "F821", "E402", "I001", "F403", "F405"]
"python/repark/src/repark/spark/dataframe/**" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["repark", "repark_parity"]
