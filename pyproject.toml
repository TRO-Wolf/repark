# uv workspace root (virtual — not itself a package). Members are the Python projects under
# python/. One shared uv.lock + .venv. Python floor 3.12 (.python-version). Ruff is the single
# lint+format tool.
#
# Phase 3 stages the member list: `python/repark-parity` joins here (the parity PR), and the
# facade `python/repark` joins with the wheel PR. Declaring a member whose directory does not
# exist fails `uv lock`, so the list only ever names what is on disk.

[tool.uv.workspace]
members = ["python/repark-parity"]

[dependency-groups]
# pandas is here so the facade's toPandas/to_pandas tests run when the facade lands; numpy
# arrives via pyarrow/pandas. duckdb backs the bench comparison scripts.
dev = ["ruff>=0.15.22,<0.16", "pytest>=9.1.1", "maturin>=1.14.1,<2", "pandas>=2.1", "duckdb==1.5.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/repark-parity/src"]

[tool.ruff.lint]
# Pragmatic-but-strict default. Annotations (ANN) enforce the "type hints on every signature"
# convention; pyupgrade (UP), bugbear (B), simplify (SIM), pathlib (PTH), naming (N) cover the rest.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF", "N", "ANN", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN201", "ANN202", "ANN001", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["repark", "repark_parity"]
