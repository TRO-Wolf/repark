# cargo-deny configuration — license compliance, security advisories, banned/duplicate crates,
# and source restrictions. Enforced in CI by .github/workflows/cargo-deny.yml.
# The eventual AWS SDK + arrow + parquet + iceberg dependency tree is large; this is the guard
# that keeps a GPL-contaminated or yanked transitive dep from sneaking in. The config was wired
# in phase 0, before the first crate landed; the workspace is armed as of phase-1 PR-A.

[advisories]
version = 2
# `cargo audit` is the dedicated CVE gate; cargo-deny also checks here.
yanked = "deny"
# Any ignore here must name the advisory, the reason it is unreachable/acceptable, and the
# revisit trigger — and be mirrored in .cargo/audit.toml (both gates scan the same tree).
# Entries below returned with the repark-iceberg dependency graph (flagged by the gate, v1's
# justified wording).
ignore = [
  # `paste` (proc-macro, pulled transitively by the arrow/datafusion tree) is unmaintained but has
  # no known vulnerability and no drop-in successor the ecosystem has migrated to. Informational
  # only — revisit if arrow/datafusion drop it or a CVE is filed. Mirrored in .cargo/audit.toml.
  "RUSTSEC-2024-0436",
  # quick-xml DoS advisories, 2026-06-29 (RUSTSEC-2026-0194 quadratic duplicate-attribute check;
  # RUSTSEC-2026-0195 unbounded namespace-declaration allocation in `NsReader`). The fixed version
  # is >=0.41.0 and is semver-unreachable from every entry path in this tree. Verified against the
  # live lockfile on 2026-08-18 with `cargo tree --workspace -i quick-xml@<v>` and a `cargo audit`
  # run with these two ids un-ignored (6 findings = 3 copies x 2 advisories) — quick-xml enters
  # THREE times:
  #   * 0.39.4 <- object_store 0.13.2 (requires ^0.39.0) <- datafusion 54.1.0
  #   * 0.38.4 <- opendal 0.55.0 (requires ^0.38) <- the owned fork's iceberg-storage-opendal 0.9.1
  #   * 0.37.5 <- reqsign 0.16.5 (requires ^0.37) <- opendal 0.55.0 / iceberg-storage-opendal 0.9.1
  # Exposure is DoS-only and the parser here only ever sees S3 API responses — XML authored by AWS
  # endpoints, not attacker-controlled input. Revisit at the next DataFusion-family bump (when
  # object_store moves past ^0.39) and when the fork bumps opendal/reqsign. Tracked in task/todo.md.
  # Mirrored in .cargo/audit.toml.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# Permissive licenses compatible with the project's Apache-2.0 posture.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # Community Data License Agreement Permissive 2.0 — `webpki-roots` (the Mozilla CA trust-store
  # bundle, pulled by aws-config's rustls stack) relicensed to it from MPL-2.0; it covers the root
  # certificate DATA, and permissively. Replaces the former MPL-2.0 allowance, which that
  # relicensing left unmatched (cargo-deny fails on unused allowances).
  "CDLA-Permissive-2.0",
  # The permissive bzip2/libbzip2 license (BSD-style, Apache-compatible). Pulled by `libbz2-rs-sys`
  # via datafusion's default compression codecs.
  "bzip2-1.0.6",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are local `{ path = ... }` deps with no version (publish = false),
# which would otherwise read as wildcards. Exempt path deps; still ban wildcard versions on externals.
allow-wildcard-paths = true
allow = []
deny = []
skip = [
  { name = "thiserror" },
  { name = "thiserror-impl" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The owned iceberg-rust fork — the [patch.crates-io] source for the iceberg* family once the
# engine crates land (phase 1). The ONLY sanctioned git source; anything else stays denied.
allow-git = ["https://github.com/TRO-Wolf/iceberg-rust"]
