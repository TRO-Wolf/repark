# ===========================================================================================
# repark — Cargo workspace root.
#
# A pure-Rust, no-JVM lazy-DataFrame + SQL engine over Apache Iceberg, built ON Apache
# DataFusion + Arrow + the owned iceberg-rust fork. See README.md for the front door and
# docs/port/PLAN.md for the port plan.
#
# Members arrive crate by crate: repark-common, repark-iceberg, repark-core (phase 1);
# repark-functions, repark-ta, repark-spark, repark-sql (phase 2); repark-ml, repark-python
# (phase 3, docs/design/python-facade.md). One DataFusion version is pinned across the
# datafusion + datafusion-spark + iceberg* family.
# ===========================================================================================

[workspace]
resolver = "3"
members = [
  "crates/repark-common",
  "crates/repark-iceberg",
  "crates/repark-core",
  "crates/repark-functions",
  "crates/repark-ta",
  "crates/repark-spark",
  "crates/repark-sql",
  "crates/repark-ml",
  "crates/repark-python",
]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/TRO-Wolf/repark"
publish = false

# -------------------------------------------------------------------------------------------
# Workspace lints — applied to every member via `[lints] workspace = true`.
# `repark-python` (the PyO3 cdylib, phase 3) does NOT inherit these; it spells out its own
# lints with `unsafe_code = "allow"` because PyO3 macro expansion emits `unsafe`.
# -------------------------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# -------------------------------------------------------------------------------------------
# Shared dependencies. One DataFusion version across datafusion + datafusion-spark + iceberg*.
# Pins carried from the private v1 repository (verified there against crates.io for the
# iceberg 0.9.1 release line and the DF 54.1 / Arrow 58.4 family catch-up); live pins below
# are the SSOT:
#   iceberg 0.9.1            → arrow-* ^58.4, parquet ^58.4  (via owned fork rev)
#   iceberg-datafusion 0.9.1 → datafusion ^54.1, parquet ^58.4
#   datafusion 54.1.0        → arrow ^58.4, parquet ^58.4
#   datafusion-spark 54.1.0  → datafusion ^54.1
# See AGENTS.md "Version-pin contract" for the bump procedure. Heavy entries stay inert until a
# crate references them with `<dep>.workspace = true`.
# -------------------------------------------------------------------------------------------
[workspace.dependencies]
# Error handling: thiserror for libs.
thiserror = "2"
# Test-only JSON (the repark-ta goldens manifest). Line carried from the v1 root manifest
# at the port-source pin.
serde_json = "1"
# Async.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Python FFI (only repark-python uses this). Pinned to 0.29 — 0.28 carried RUSTSEC-2026-0176
# (OOB read in PyList/PyTuple nth/nth_back) and RUSTSEC-2026-0177 (missing Sync bound on
# PyCFunction::new_closure), both fixed in 0.29.0. `abi3-py312` = ONE `cp312-abi3` wheel per
# platform, no interpreter matrix (design §4 Q6). Spec carried verbatim from the v1 root
# manifest at the port-source pin; `extension-module` / `auto-initialize` are selected by the
# binding crate, never here (AGENTS.md "PyO3 build notes").
pyo3 = { version = "0.29", features = ["abi3-py312"] }
async-trait = "0.1"
# Streams (collecting iceberg scan streams) + unique names for scratch tables / data files /
# commit operation-ids (ENGINE_CONTRACT §8 stamping). v4: pure-random, no clock dependency.
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
# Catalog-edge / write-path spans and warnings (`tracing::warn!` on failed scratch-table
# deregister). Ratified addition (orchestrator ruling R3, 2026-08-06).
tracing = "0.1"
# Feature-gated mimalloc global allocator (repark-python only; default off).
# Ratified addition — orchestrator ruling, conductor-19 charter, 2026-08-16; allocator
# spike, feature-gated default-off.
mimalloc = "0.1"
# Foundation — one unified version family (DataFusion 54.1 / Arrow 58.4).
datafusion = "54.1.0"
datafusion-spark = "54.1.0"
arrow = "58.4"
arrow-array = "58.4"
arrow-schema = "58.4"
parquet = "58.4"
# S3 object-store reads (`s3://` warehouses + `s3a://` Spark bronze). `object_store` is
# DataFusion's object-store abstraction: it MUST stay at the DataFusion 54.1 family's version
# (lockfile-resolved), so the version is workspace-pinned; the `aws` feature adds the S3 client
# DataFusion does not enable itself. `aws-config` + `aws-credential-types` bridge the AWS
# default credential chain into an `object_store` `CredentialProvider` — `from_env` alone
# can't read a shared-credentials file.
object_store = { version = "0.13", features = ["aws"] }
aws-config = "1"
aws-credential-types = "1"
url = "2"
# TIMESTAMP AS OF string → epoch ms (UTC wall-clock parse) — the hoisted time_travel parsers.
# Line verbatim from the v1 root manifest at the port-source pin.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `SHOW NAMESPACES … LIKE` pattern semantics (Spark `StringUtils.filterPattern` is Java-regex
# backed) — consumed by repark-spark's describe/show module. Line carried from the v1 root
# manifest at the port-source pin.
regex = "1"
# Foundation — the iceberg 0.9.1 family, one version with the DataFusion 54.1 / Arrow 58.4 pins.
iceberg = "0.9.1"
iceberg-datafusion = "0.9.1"
iceberg-catalog-glue = "0.9.1"
iceberg-catalog-s3tables = "0.9.1"
# The fork's OpenDAL-backed object storage — the S3-capable `FileIO` factory the Glue /
# S3 Tables catalogs use internally; consumed directly (with `opendal-s3`) for scheme-based
# FileIO selection.
iceberg-storage-opendal = "0.9.1"
# Internal crates. Path-only + `default-features = false`.
# `default-features = false` is the one-way door: retrofitting it after internal feature flags
# proliferate is a workspace-wide breaking change (rust-lang/cargo#11329), so it lands now
# while the internal feature surface is empty. No `version` field: `[workspace.package] version`
# is the single release SSOT and a literal requirement here would have to chase every bump
# (a stale one fails resolution). The workspace is `publish = false` and crates.io is deferred
# (docs/release.md); version requirements return only when crates get published.
repark-common = { path = "crates/repark-common", default-features = false }
repark-iceberg = { path = "crates/repark-iceberg", default-features = false }
repark-core = { path = "crates/repark-core", default-features = false }
repark-functions = { path = "crates/repark-functions", default-features = false }
repark-ta = { path = "crates/repark-ta", default-features = false }
repark-spark = { path = "crates/repark-spark", default-features = false }
repark-sql = { path = "crates/repark-sql", default-features = false }
repark-ml = { path = "crates/repark-ml", default-features = false }

# -------------------------------------------------------------------------------------------
# The owned iceberg-rust fork: the whole iceberg* family is sourced from the owned fork, whose
# main has been the owned 0.9.1 base (same DF 54.1 / arrow 58.4 family). The rev is pinned;
# bump it together with datafusion/arrow/parquet per the version-pin contract.
# pins: rp-3-fork-repin/C-001, C-002 (family freeze: DF/arrow/parquet/toolchain unchanged)
# iceberg-catalog-glue / -s3tables are patched for family consistency and consumed by the
# repark-iceberg catalog module (Glue primary + S3 Tables secondary builders).
# -------------------------------------------------------------------------------------------
[patch.crates-io]
iceberg = { git = "https://github.com/TRO-Wolf/iceberg-rust", rev = "c1d6c9de1498cf04765893ef3f698d915766a6a7" }
iceberg-datafusion = { git = "https://github.com/TRO-Wolf/iceberg-rust", rev = "c1d6c9de1498cf04765893ef3f698d915766a6a7" }
iceberg-catalog-glue = { git = "https://github.com/TRO-Wolf/iceberg-rust", rev = "c1d6c9de1498cf04765893ef3f698d915766a6a7" }
iceberg-catalog-s3tables = { git = "https://github.com/TRO-Wolf/iceberg-rust", rev = "c1d6c9de1498cf04765893ef3f698d915766a6a7" }
iceberg-storage-opendal = { git = "https://github.com/TRO-Wolf/iceberg-rust", rev = "c1d6c9de1498cf04765893ef3f698d915766a6a7" }

# -------------------------------------------------------------------------------------------
# Build profiles (carried from the private v1 repository). Profiles are architecture — every
# knob below names the workload it serves so a later round tunes from a recorded rationale,
# not a guess. `dev` and `release` are the two Cargo invokes by default; `ci` and `profiling`
# are opt-in shapes selected with `--profile <name>`.
# -------------------------------------------------------------------------------------------

# Dev/test profile (cargo test, maturin develop). Trim debuginfo to line tables: in v1 the
# cdylib was ~828 MB (≈74% full DWARF), so line-tables-only keeps file:line backtraces while
# cutting artifact size + link time sharply. Full variable-level DWARF isn't needed for this
# engine's test/print-debug workflow.
[profile.dev]
debug = "line-tables-only"

# Batch-build profile for a CI runner. A runner builds each crate once from a restored cache and
# then throws the tree away, so the two dev conveniences are pure cost there: `incremental =
# false` drops the incremental bookkeeping, and `debug = false` drops the line tables.
# `[profile.ci.package."*"]` repeats `debug = false` for DEPENDENCIES specifically: they are
# where the debuginfo volume lives, so the strip survives a later edit that turns workspace
# debuginfo back on for backtraces.
#
# DORMANT: nothing invokes `--profile ci`. Measured in v1: the cold-build win was under the
# adoption bar and warm rebuilds were slower (`incremental = false`); what it buys is artifact
# weight. Re-measure before wiring; do not wire on this comment.
[profile.ci]
inherits = "dev"
incremental = false
debug = false

[profile.ci.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

# Flamegraph / perf profile: release codegen that a profiler can still read. `debug = true` asks
# for the DWARF perf needs to resolve frames, and `strip = false` pins that it survives — the pin
# is what makes the pair robust, since `strip` follows `debug` by default and an inherited or
# later-added `strip` in `release` would otherwise silently turn this profile back into a wall
# of `[unknown]`. `lto = false` and `codegen-units = 16` stop cross-crate inlining from erasing
# the very frames being measured, and cut the link time of a build that is thrown away after one
# run. Not a shipping profile: use `release` for artifacts.
[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16
