# Spell-check config for crate-ci/typos (CI: .github/workflows/typos.yml).
# Add real domain terms here when typos flags them; do not silence genuine misspellings.

[files]
extend-exclude = [
  "*.lock",
  "target/",
  ".venv/",
  "*.svg",
  # Recorded census evidence (task/census/**): report/junit artifacts embed verbatim
  # Apache-suite tracebacks and third-party identifiers. Evidence is never hand-edited, so it
  # is excluded rather than "fixed" (phase-3 PR-4; reduced to the facade pin by DL-1).
  "task/census/",
  # Spark-written Iceberg fixture (Avro/Parquet/Puffin). Binary; not prose.
  "crates/repark-spark/src/tests/fixtures/",
  # Recorded MW-6 Critic evidence (oracle logs + disassembly): verbatim, never hand-edited,
  # same rationale as task/census/ (PROC-1, 2026-08-25).
  "task/mw-6-critic-evidence/",
]

[default.extend-identifiers]
# Identifiers (code symbols) that are not typos.
repark = "repark"

[default.extend-words]
# Words that look like typos but are intentional in this domain.
mis = "mis"         # the `mis-` prefix (mis-placement / mis-wired) in prose — typos splits on the hyphen
MoR = "MoR"         # merge-on-read
ser = "ser"         # serialize (serde idiom)
hel = "hel"         # substr('hello', …) expected-value fixture in the Spark substring parity tests
tema = "tema"       # TA-Lib TEMA (triple exponential moving average)
TEMA = "TEMA"       # TA-Lib TEMA (triple exponential moving average)
CMO = "CMO"         # TA-Lib CMO (Chande momentum oscillator)
TRO = "TRO"         # TRO-Wolf org / owned iceberg-rust fork (typos splits TRO-Wolf → TRO)
afe = "afe"
formatt = "formatt" # DELIBERATE misspelling: the ANSI door's unknown-bare-key refusal fixture
SELCT = "SELCT"     # DELIBERATE misspelling: the wrong-door sniff's "don't speculate" fixture
limt = "limt"       # DELIBERATE misspelling: the pseudo-key-typo loud-refusal fixture (P3E B-1)
