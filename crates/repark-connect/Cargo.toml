[package]
name = "repark-connect"
description = "Database connectivity for repark: connection settings and the remote-to-Arrow type maps for Postgres and SQL Server sources."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = [
  "dep:bytes",
  "dep:futures",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
]

[dependencies]
repark-common.workspace = true
datafusion.workspace = true
arrow.workspace = true
thiserror.workspace = true
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["ring", "std", "tls12"] }
rustls-native-certs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "time"] }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
