[package]
name = "repark-spark"
description = "The Spark SQL door: v1 repark-sql ported — statement router, SparkDialect, SparkExtension."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# DataFusion/iceberg-native: the front end parses with DataFusion's re-exported sqlparser and
# reaches Iceberg through the fork family. `repark-iceberg` carries the catalog wiring + the
# table-mutating primitives the router delegates to (namespace invalidation now; ALTER + MERGE
# with PR-3a/PR-3b).
datafusion.workspace = true
iceberg.workspace = true
iceberg-datafusion.workspace = true
repark-iceberg.workspace = true
# The phase-1 seams this door plugs into: `SqlDialect`/`EngineContext` (SparkDialect),
# `SessionExtension` (SparkExtension), and the hoisted `CatalogRegistry` + time-travel pin half.
repark-core.workspace = true
# `analyze_eagerly` — the one blessed way to analyze a plan before its schema crosses a
# boundary (the passthrough's eager analysis) — plus the SEC-02 `repark.sql.*` settings reader.
repark-functions.workspace = true
# The TA window UDFs: `SparkExtension` composes `TaExtension` at v1's registration position, so a
# Spark-extended session keeps `ta_ema(close, 21) OVER (…)` callable (design Q11 — the TA set is
# door-neutral; this crate is a consumer, not its owner). Same-tier edge (both tier 3), DAG-legal.
repark-ta = { workspace = true, features = ["datafusion"] }
# `SqlDialect` is an async trait (phase-1 seam contract).
async-trait.workspace = true
# `SHOW NAMESPACES … LIKE` — Spark's `StringUtils.filterPattern` compiles each `|`-separated
# alternative as a Java regex (after `*` → `.*`), so `filter_pattern_matches` needs a real engine.
regex.workspace = true

[dev-dependencies]
# `repark_common::surfaces` — the dialect-neutral surface registry the Q13 matrix audits this
# door against (design `docs/design/sql-doors.md` §2 Q13). A DEV dependency because the only
# consumer is `src/matrix.rs`, which is `#[cfg(test)]` audit evidence: nothing in the shipped
# crate reads the registry. It graduates to a regular dependency the day product code does
# (design §1 lists repark-common in this door's dep set for exactly that reason).
repark-common.workspace = true
# The ported v1 lib-root battery streams fork scans (`try_collect`) and builds timestamp
# fixtures — dev-only here (the production stream map lives in repark-iceberg, as in v1).
chrono.workspace = true
futures.workspace = true
tokio.workspace = true
tempfile = "3"
