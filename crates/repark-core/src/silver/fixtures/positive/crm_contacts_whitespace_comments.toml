plan_format_version = 1

dataset_id = "crm.contacts.silver"

[source]
source_system_id = "crm-production"
catalog = "application"
schema = "crm"
table = "contacts"

[input_contract]
kind = "versioned_rows_without_deletes"
bronze_record_id_field = 90

[[columns]]
source_field_id = 1
target_name = "contact_id"
target_type = { kind = "int64" }
nullable = false
transforms = []
validators = [{ rule_id = "contact_id_required", kind = "require_non_null" }]

[[columns]]
source_field_id = 2
target_name = "first_name"
target_type = { kind = "utf8" }
nullable = true
transforms = [
  { kind = "trim", characters = ["U+0020"] },
  { kind = "empty_to_null" },
]
validators = []

[[columns]]
source_field_id = 3
target_name = "created_at"
target_type = { kind = "timestamp", unit = "microsecond", timezone = "UTC" }
nullable = true
transforms = [
  { kind = "parse_timestamp", format_id = "iso8601_seconds_offset_v1", invalid_value = "quarantine_record" },
]
validators = []

[[columns]]
source_field_id = 91
target_name = "source_version"
target_type = { kind = "int64" }
nullable = false
transforms = []
validators = [{ rule_id = "source_version_required", kind = "require_non_null" }]

[selection]
strategy = "latest_source_version"
key_fields = [1]
order_fields = [{ source_field_id = 91, direction = "descending" }]
conflicting_tie = "fail_run"
identical_source_payload_tie = "lowest_bronze_record_id"

[[quality]]
rule_id = "row_accounting"
kind = "exact_disposition_accounting"

[[quality]]
rule_id = "accepted_keys"
kind = "accepted_key_uniqueness"

[[quality]]
rule_id = "invalid_winners"
kind = "ratio_at_most"
numerator = "quarantined_keyed_winners"
denominator = "keyed_winners"
threshold = 0.01
on_empty = "pass"

[[quality]]
rule_id = "invalid_keys"
kind = "ratio_at_most"
numerator = "unkeyed_quarantined_rows"
denominator = "input_rows"
threshold = 0.0
on_empty = "pass"

[publication]
strategy = "single_classified_table"
empty_input = "require_explicit_empty_replace_option"
