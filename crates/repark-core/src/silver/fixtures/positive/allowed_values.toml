plan_format_version = 1
dataset_id = "crm.status.silver"

[source]
source_system_id = "crm-production"
catalog = "application"
schema = "crm"
table = "status"

[input_contract]
kind = "row_snapshot"
bronze_record_id_field = 1

[[columns]]
source_field_id = 1
target_name = "status_id"
target_type = { kind = "int64" }
nullable = false
transforms = []
validators = [{ rule_id = "status_id_required", kind = "require_non_null" }]

[[columns]]
source_field_id = 2
target_name = "status"
target_type = { kind = "utf8" }
nullable = true
transforms = [
  { kind = "trim", characters = ["U+0020"] },
  { kind = "empty_to_null" },
]
validators = [
  { rule_id = "status_allowed", kind = "check_allowed_values", values = [
    "open",
    "closed",
  ] },
]

[selection]
strategy = "disabled"

[[quality]]
rule_id = "row_accounting"
kind = "exact_disposition_accounting"

[publication]
strategy = "single_classified_table"
empty_input = "require_explicit_empty_replace_option"
