plan_format_version = 1
dataset_id = "ops.codes.silver"

[source]
source_system_id = "ops"
catalog = "application"
schema = "ops"
table = "codes"

[input_contract]
kind = "row_snapshot"
bronze_record_id_field = 1

[[columns]]
source_field_id = 1
target_name = "created_at"
target_type = { kind = "timestamp", unit = "microsecond", timezone = "America/New_York" }
nullable = true
transforms = [
  { kind = "parse_timestamp", format_id = "iso8601_seconds_offset_v1", invalid_value = "quarantine_record" },
]
validators = []

[selection]
strategy = "disabled"

[[quality]]
rule_id = "row_accounting"
kind = "exact_disposition_accounting"

[publication]
strategy = "single_classified_table"
empty_input = "require_explicit_empty_replace_option"
