plan_format_version = 1
dataset_id = "ops.codes.silver"

[source]
source_system_id = "ops"
catalog = "application"
schema = "ops"
table = "codes"

[input_contract]
kind = "row_snapshot"
bronze_record_id_field = 1

[[columns]]
source_field_id = 1
target_name = "code"
target_type = { kind = "int32" }
nullable = false
transforms = []
validators = [{ rule_id = "code_required", kind = "require_non_null" }]

[selection]
strategy = "disabled"

[[quality]]
rule_id = "invalid_keys"
kind = "ratio_at_most"
numerator = "unkeyed_quarantined_rows"
denominator = "input_rows"
threshold = nan
on_empty = "pass"

[publication]
strategy = "single_classified_table"
empty_input = "require_explicit_empty_replace_option"
