# The repark-ta crate provides pure-Rust, bit-exact TA-Lib C 0.4.0 technical-analysis kernels.

[package]
name = "repark-ta"
description = "Pure-Rust TA-Lib-parity technical-analysis kernels for the repark engine."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `datafusion` turns on the window-UDF wrapper layer (`udf` module): the kernels exposed as
# DataFusion `WindowUDF`s callable from SQL (`ta_ema(close, 21) OVER (…)`) and the DataFrame API,
# plus the `extension` module (`TaExtension`, the `repark_core::SessionExtension` wrapper — hence
# `dep:repark-core` rides the same flag). Kept optional so the kernel core stays dependency-light
# and independently publishable.
datafusion = ["dep:datafusion", "dep:repark-core"]

[dependencies]
thiserror.workspace = true
datafusion = { workspace = true, optional = true }
# The phase-1 registration seam (`SessionExtension`) that `TaExtension` implements. Optional and
# feature-tied: the kernel core must not pull the engine in (tier 3 → tier 2 edge, DAG-legal).
repark-core = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# `#[tokio::test]` — the `TaExtension` test registers the UDFs on a `SessionContext` and runs
# the SQL window route, so it needs a runtime (the kernel batteries stay sync).
tokio.workspace = true
# P-1 (perf-wave-14): kernel criterion baseline — pin at crate level (never
# workspace.dependencies). Feature set matches `repark-functions` (PERF-10).
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "ta_kernels"
harness = false
