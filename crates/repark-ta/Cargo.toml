# ===========================================================================================
# repark-ta — RePark's own pure-Rust technical-analysis kernels.
#
# Bit-exact ports of the TA-Lib C 0.4.0 reference algorithms (no C linkage, no vendored
# code — hand-ported, golden-gated). Dependency-light by design — the kernel core's only
# runtime dep is `thiserror`, so the crate stays independently publishable; the optional
# `datafusion` feature (T1b, landed) adds the window-UDF wrapper layer (`udf` module) that the
# Spark door enables to register the TA UDFs at session build.
# ===========================================================================================

[package]
name = "repark-ta"
description = "Pure-Rust TA-Lib-parity technical-analysis kernels for the repark engine."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `datafusion` turns on the window-UDF wrapper layer (`udf` module): the kernels exposed as
# DataFusion `WindowUDF`s callable from SQL (`ta_ema(close, 21) OVER (…)`) and the DataFrame API.
# Kept optional so the kernel core stays dependency-light and independently publishable.
datafusion = ["dep:datafusion"]

[dependencies]
thiserror.workspace = true
datafusion = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
