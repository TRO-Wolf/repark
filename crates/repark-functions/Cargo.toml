[package]
name = "repark-functions"
description = "Spark-compatible function registry: datafusion-spark plus a Spark-semantics date shim."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# DataFusion-native crate: registration + UDFs speak `datafusion::error::Result` directly, so this
# crate does not depend on repark-core (the DataFusionError -> repark_core::Error conversion
# happens one layer up, in repark-core). See map.md.
datafusion.workspace = true
datafusion-spark.workspace = true
# `chrono-tz` is DECLARED, not inherited: `arrow::array::timezone::Tz` accepts only fixed offsets
# without it, so every IANA zone id would be refused at query time by the session-timezone
# extraction path (`datetime::extraction_time_zone`). It was already resolved transitively via
# `datafusion-functions`; owning it here means a DataFusion feature change cannot silently turn
# `spark.sql.session.timeZone = "America/New_York"` into a hard execution failure. Same reasoning
# as `repark-core`'s declaration (h1a-ledger.md finding S-6).
arrow = { workspace = true, features = ["chrono-tz"] }
chrono.workspace = true

[dev-dependencies]
# `#[tokio::test]` — the date-shim tests register the UDFs into a SessionContext and run SQL.
tokio.workspace = true
# PERF-10 (r24 G10): ratio micro-benches — pin at crate level (never workspace.dependencies).
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "ratio_string_datetime"
harness = false
