[package]
name = "repark-sql"
description = "The ANSI/Trino-flavoured SQL door: AnsiDialect, the statement router, and the Iceberg DDL handlers."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The parser + planner. sqlparser types are reached ONLY through `datafusion::sql::sqlparser`
# (design §2 Q14: stock DataFusion parser machinery, Generic dialect) — there is deliberately
# NO direct `sqlparser` dependency here, and no `datafusion-spark`: the ANSI door must not be
# able to reach Spark expression semantics through a crate edge (they are session-scoped, via
# the Spark door's extension).
datafusion.workspace = true
# The phase-1 seams: `SqlDialect` / `EngineContext` (the frozen seam this door implements),
# `CatalogRegistry` + `LocationPolicy` (Q15 routing), and the error fold.
repark-core.workspace = true
# The tier-1 Iceberg surface the handlers delegate to: catalog provider invalidation, namespace
# location resolution, scheme-selected `FileIO`, and the staged-write helpers.
repark-iceberg.workspace = true
# The error seed (kept explicit so a handler can name `repark_common::Error` at a seam).
repark-common.workspace = true
# DEVIATION (recorded in the ledger): the design's dep list names the four workspace crates
# above. Two mechanically-required deps are added:
#  * `iceberg` — the staged create/replace transaction (`StagedTableTransaction`,
#    `TableCreation`, `NamespaceIdent`/`TableIdent`, `Transform`) is iceberg-rust API that
#    repark-iceberg does not re-export as types. The Spark door carries the same edge.
#  * `async-trait` — `SqlDialect::execute` is an `#[async_trait]` method (frozen seam); the
#    impl cannot be written without the macro.
# Neither reaches sqlparser or datafusion-spark, so the design's actual constraint holds.
iceberg.workspace = true
async-trait.workspace = true

[dev-dependencies]
# End-to-end door tests build a real `ReparkSession` over an in-memory Iceberg catalog and read
# results back on the Arrow path (value AND type).
tokio.workspace = true
tempfile = "3"
# DEV-ONLY, and deliberately so. `scripts/check_crate_dag.py` scopes the layering rule to NORMAL
# edges (dev-/build-dependencies are excluded by design — same carve-out repark-spark's dev-dep on
# repark-common already rides), so these do NOT create the forbidden door→door product edge:
#  * `repark-spark` — the Q13/G5 CROSS-DOOR two-session protocol needs the OTHER door's dialect
#    and extension in one test binary. There is no other way to compare two doors, and the design
#    mandates the comparison (§2 Q13). Nothing in `src/` may name this crate.
#  * `repark-ta` (feature `datafusion`) — the Q11 ANSI toll: `TaExtension` installed on a NATIVE
#    session, one kernel driven through THIS door's SQL, compared `f64::to_bits` against the
#    kernel the goldens gate. The TA set is owned by neither door (design §2 Q11).
repark-spark.workspace = true
repark-ta = { workspace = true, features = ["datafusion"] }
