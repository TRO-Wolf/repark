# Alternate local-gate path for devs who use the `pre-commit` framework
# (`pipx install pre-commit && pre-commit install`). The canonical gate is `make ci`.
# Hook-eligible tools listed here must stay a subset of the Makefile targets;
# PYC-5 dropped python-conventions from this file (and from `make install-hooks`)
# because it sits on the sub-second budget line. `map-sync-guard`
# (`make check-map-sync`) joined at n=5 median 0.08 s over 143 maps.
# `docstring-presence-guard` joined at PYC-6 (n=5 median 0.13 s). Pins are
# kept current by Dependabot / `pre-commit autoupdate`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22  # keep in lockstep with the Makefile/ci.yml ruff pin
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: taplo-format
        name: taplo format --check
        entry: uvx taplo@0.9.3 format --check
        language: system
        types: [toml]
        pass_filenames: false
      - id: taplo-lint
        name: taplo lint
        entry: uvx taplo@0.9.3 lint
        language: system
        types: [toml]
        pass_filenames: false
      - id: map-md-guard
        name: map.md lockstep guard
        entry: scripts/check_map_md.sh
        language: script
        pass_filenames: false
      - id: map-sync-guard
        name: map.md link-validity guard
        entry: python3 scripts/sync_map_md.py --check
        language: system
        pass_filenames: false
      - id: crate-dag-guard
        name: crate dependency-policy guard
        entry: scripts/check_crate_dag.sh
        language: script
        pass_filenames: false
      - id: manifest-guard
        name: structural-manifest guard
        entry: scripts/check_manifest.sh
        language: script
        pass_filenames: false
      - id: lib-rs-guard
        name: lib.rs thinness guard
        entry: scripts/check_lib_rs.sh
        language: script
        pass_filenames: false
      - id: rust-file-size-guard
        name: rust file-size guard
        entry: scripts/check_rust_file_size.sh
        language: script
        pass_filenames: false
      - id: lib-py-guard
        name: facade .py thinness guard
        entry: scripts/check_lib_py.sh
        language: script
        pass_filenames: false
      - id: docstring-presence-guard
        name: public-docstring presence ratchet
        entry: scripts/check_docstring_presence.sh
        language: script
        pass_filenames: false
