# Alternate local-gate path for devs who use the `pre-commit` framework
# (`pipx install pre-commit && pre-commit install`). The canonical gate is `make ci`; both invoke
# the same underlying tools so they cannot drift. Pins are kept current by Dependabot /
# `pre-commit autoupdate`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22  # keep in lockstep with the Makefile/ci.yml ruff pin
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: taplo-format
        name: taplo format --check
        entry: uvx taplo@0.9.3 format --check
        language: system
        types: [toml]
        pass_filenames: false
      - id: taplo-lint
        name: taplo lint
        entry: uvx taplo@0.9.3 lint
        language: system
        types: [toml]
        pass_filenames: false
      - id: map-md-guard
        name: map.md lockstep guard
        entry: scripts/check_map_md.sh
        language: script
        pass_filenames: false
      - id: crate-dag-guard
        name: crate dependency-policy guard
        entry: scripts/check_crate_dag.sh
        language: script
        pass_filenames: false
      - id: manifest-guard
        name: structural-manifest guard
        entry: scripts/check_manifest.sh
        language: script
        pass_filenames: false
      - id: lib-rs-guard
        name: lib.rs thinness guard
        entry: scripts/check_lib_rs.sh
        language: script
        pass_filenames: false
      - id: lib-py-guard
        name: facade .py thinness guard
        entry: scripts/check_lib_py.sh
        language: script
        pass_filenames: false
