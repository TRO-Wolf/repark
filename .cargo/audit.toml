# cargo-audit configuration (read by the audit gates; see the Makefile `rust-audit` target).
# Keep the ignore list in sync with deny.toml's [advisories].ignore — both gates scan the same
# tree. Any ignore must name the advisory, the reason, and the revisit trigger, mirrored in
# deny.toml. Entries below returned with the repark-iceberg dependency graph (flagged by the
# gate, v1's justified wording).

[advisories]
ignore = [
  # `paste` (proc-macro) is unmaintained but not vulnerable; pulled transitively by arrow/datafusion.
  # See deny.toml for the full rationale. Revisit if a real CVE lands or the upstream tree drops it.
  "RUSTSEC-2024-0436",
  # quick-xml DoS advisories (quadratic duplicate-attribute check / unbounded namespace allocation).
  # Fix is >=0.41.0, semver-unreachable from every entry path. Verified against the live lockfile
  # 2026-08-18 — THREE copies: 0.39.4 via object_store 0.13.2 (requires ^0.39.0, pulled by
  # datafusion 54.1.0), 0.38.4 via opendal 0.55.0 (requires ^0.38, via the fork's
  # iceberg-storage-opendal 0.9.1), and 0.37.5 via reqsign 0.16.5 (requires ^0.37). In this tree
  # quick-xml only parses S3 API responses (AWS-originated XML), never attacker-controlled input.
  # See deny.toml for the full rationale. Revisit at the next DataFusion-family bump.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # zstd advisories, 2026-10-26: RUSTSEC-2026-0391 (`zstd` 0.13.3, patched >=0.14.3) and
  # RUSTSEC-2026-0398 / RUSTSEC-2026-0403 (`zstd-safe` 7.2.4, patched >=8.2.0). The 0.14 line is
  # semver-unreachable: nine dependents pin zstd 0.13 (`parquet` 58.4.0, `arrow-ipc` 58.4.0,
  # `datafusion` 54.1.0, `datafusion-datasource` 54.1.0, `apache-avro` 0.21.0, `orc-rust` 0.8.0,
  # `compression-codecs` 0.4.38, the owned fork `iceberg` 0.9.1 rev d80a2884, `repark-core`);
  # parquet/arrow 60 are on 0.14 but datafusion 55.2.0 still requires `^0.13` and the fork follows
  # datafusion. Measured 2026-10-26: seekable use (0398) is absent from all six zstd-using
  # dependents' sources; reachability is NOT established for 0391 and 0403. See deny.toml for the
  # full rationale. Revisit at the datafusion release on arrow 60, then the fork repin, then the
  # zstd bump; tracked by card DEPS-1. Mirrored in deny.toml.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
]
