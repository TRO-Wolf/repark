services:
  postgres:
    image: postgres:16-alpine
    pull_policy: missing
    command:
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_PASSWORD: repark
    ports:
      - "127.0.0.1::5432"
    shm_size: 256m
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
          pids: 256
    labels:
      repark.disposable: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 30
